<svg xmlns="http://www.w3.org/2000/svg">
  <!-- LBI sprite sheet (plan §6 Phase 4; docs/identity/symbols.md). Used as
       <svg><use href="./assets/sprites.svg#id"/></svg>. Budget: 25 KB, held
       by tests/art-set.test.mjs, which also checks the glint and the motifs
       against their sources so the two copies cannot drift.
       Symbols without their own fill or stroke take the colours of the <svg>
       that uses them. -->

  <!-- S1 Gilt star at 32 px and up, without the halo (that is 64 px and up).
       Long points 47, short 31, valleys 15, hole 6, in a 100 box. -->
