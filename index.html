<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Backstop for the innerHTML sinks: even if an unescaped value slipped
       through, no inline/injected script can execute (script-src 'self', no
       'unsafe-inline'). Inline STYLE attributes are used throughout the app, so
       style-src keeps 'unsafe-inline'. Every other directive is 'self' or
       'none': the fonts are vendored, so the app loads nothing off-origin and
       privacy.html's "no third parties" claim is literally true. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve, which the
       fixed mobile tab bar uses to clear the iPhone home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Life Balance Index — Personal Wellbeing Assessment</title>
  <meta name="description" content="Assess your wellbeing across eight life aspects against cited Thai and international benchmarks. Local-first: your answers never leave your device, and there is no account.">
  <meta name="theme-color" content="#24344d">
  <link rel="canonical" href="https://lbi.plainpoint.net/">
  <!-- Link previews. og:image reuses the maskable app icon: it is the only
       image we ship that reads at small sizes, and shipping a dedicated
       1200x630 card would add weight the app itself never loads. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Life Balance Index">
  <meta property="og:title" content="Life Balance Index — Personal Wellbeing Assessment">
  <meta property="og:description" content="Assess your wellbeing across eight life aspects against cited benchmarks. Local-first, no account.">
  <meta property="og:url" content="https://lbi.plainpoint.net/">
  <meta property="og:image" content="https://lbi.plainpoint.net/assets/icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <!-- Source Serif 4 (headings) + Inter (body) + Sarabun (Thai glyphs),
       vendored under assets/fonts. Self-hosting removes the round-trip to
       Google on every cold load, makes the PWA genuinely offline-capable,
       and means no visitor IP is disclosed to a third party. -->
  <link rel="stylesheet" href="./assets/fonts/fonts.css?v=113">
  <link rel="stylesheet" href="./index.css?v=113">
  <!-- The redesign's frame; loaded after index.css so it wins where both
       style the same element. One sheet per redesign area, each under 800
       lines (docs/redesign-build-plan.md §3). -->
  <link rel="stylesheet" href="./css/frame.css?v=113">
  <link rel="stylesheet" href="./css/stage-page.css?v=113">
  <link rel="stylesheet" href="./css/home.css?v=113">
  <link rel="stylesheet" href="./css/journey.css?v=113">
  <link rel="stylesheet" href="./css/weekly.css?v=113">
  <link rel="stylesheet" href="./css/more.css?v=113">
</head>
<body>
  <!-- Skip link (WCAG 2.4.1). href is #main-view for the semantics and for the
       no-JS case, but app.js intercepts the click: this is a hash-routed app,
       so letting the browser set location.hash = "#main-view" would fire the
       router, which resolves anything unknown to the dashboard and would throw
       the user off whatever tab they were on. -->
  <a id="skip-link" class="skip-link" href="#main-view">Skip to main content</a>
  <!-- The frame (redesign R1, docs/redesign-build-plan.md): a burger menu in
       place of the bottom tab bar, the Anton wordmark, the language button,
       and on a wide screen the quick links. The header sits OUTSIDE #page so
       it stays usable while the menu is open and the page behind it is inert. -->
  <header id="site-header" class="site-header">
    <button id="btn-menu" class="burger" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu"><span></span><span></span><span></span></button>
    <!-- The wordmark is a mark: LIFE BALANCE INDEX in both languages. Its
         accessible name is the translated app name, which app.js writes. -->
    <h1 class="wordmark"><a id="brand-home" href="#/dashboard"><span class="wordmark-mark" aria-hidden="true">LIFE BALANCE<small>INDEX</small></span><span class="sr-only" id="brand-name">Life Balance Index</span></a></h1>
    <nav id="navpill" class="navpill d-none" aria-label="Sections">
      <a id="navpill-dashboard" href="#/dashboard">Overview</a>
      <a id="navpill-review" href="#/review">Weekly Review</a>
      <a id="navpill-quests" href="#/quests">Goals</a>
      <a id="navpill-leaderboard" href="#/leaderboard">Side by Side</a>
    </nav>
    <!-- The journey's progress star (views/journey-progress.js). aria-hidden:
         the journey's own live status line says the same thing in words. -->
    <div id="journey-progress" class="navpill journey-progress d-none" aria-hidden="true"></div>
    <div class="header-actions">
      <!-- Lumi's star (views/lumi.js): opens the tip panel below. Shown once
           the journey is done, since before that there is nothing to say. -->
      <button id="btn-lumi" class="circlebtn lumi-btn d-none" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="lumi-panel" aria-label="Lumi's tip"></button>
      <button id="btn-lang" class="circlebtn" type="button"><span class="sr-only">Switch language: </span><span lang="th">ไทย</span></button>
    </div>
  </header>

  <!-- Lumi's tip (views/lumi.js), outside #page like the header, so it stays
       usable whatever the page behind it is doing. Filled when opened. -->
  <aside id="lumi-panel" class="lumi" role="dialog" aria-labelledby="lumi-title" tabindex="-1" hidden></aside>

  <!-- Filled by views/menu.js. Hidden (visibility) while closed, so nothing in
       it can take focus until the burger opens it. -->
  <nav id="site-menu" class="site-menu" aria-hidden="true" aria-label="Main menu"></nav>

  <div class="app-container" id="page">
    <!-- Main View Mount -->
    <main id="main-view" tabindex="-1" aria-label="Main content">
      <!-- Injected views go here -->
    </main>

    <!-- Visually-hidden live region: announces the current view to screen
         readers on navigation (finding #12). -->
    <div id="route-announcer" class="sr-only" role="status" aria-live="polite"></div>

    <!-- Footer: privacy/source/version must be reachable from the app itself,
         not only from the GitHub repo (review: PDPA statement was invisible
         to users of the live site). -->
    <footer class="app-footer site-footer">
      <!-- symbols.md S1 Gilt star over the stacked wordmark, as in the
           prototype's footer. Decorative: the links carry the meaning. -->
      <div class="footer-mark" aria-hidden="true">
        <svg class="brand-star" viewBox="0 0 100 100" width="56" height="56" focusable="false"><use href="./assets/sprites.svg#star"/></svg>
        <span>LIFE BALANCE<br>INDEX</span>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a id="footer-privacy" href="./privacy.html">Privacy &amp; Data</a>
        <a id="footer-methodology" href="#/methodology">Methodology</a>
        <a id="footer-source" href="https://github.com/SEEHIGHxb/LifeBalanceIndex" target="_blank" rel="noopener noreferrer">Source code &amp; license</a>
      </nav>
      <p class="footer-meta"><span id="footer-local">Stored only in this browser</span><span id="footer-version">Version 22</span></p>
    </footer>
  </div>

  <!-- Core Scripts -->
  <script type="module" src="./app.js?v=113"></script>
</body>
</html>
